apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-tk831-default-role-nextcloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  target:
    template:
      type: kubernetes.io/basic-auth
    deletionPolicy: Delete
  data:
  - secretKey: username
    remoteRef:
      key: nextcloud/postgres/username
  - secretKey: password
    remoteRef:
      key: nextcloud/postgres/password
