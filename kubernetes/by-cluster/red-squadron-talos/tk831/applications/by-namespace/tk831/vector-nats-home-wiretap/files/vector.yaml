data_dir: /vector-data-dir
api:
  enabled: true
  address: 127.0.0.1:8686
schema:
  log_namespace: true
sources:
  internal_metrics:
    type: internal_metrics
  nats_wiretap:
    type: nats
    connection_name: vector-nats-home-wiretap
    url: nats://nats.tk831.svc.cluster.local
    auth:
      strategy: user_password
      user_password:
        user: "$NATS_USERNAME"
        password: "$NATS_PASSWORD"
    subject: ">"
transforms:
  nats_event_transform:
    type: remap
    inputs: [nats_wiretap]
    drop_on_abort: true
    drop_on_error: true
    source: |-
      . = {
        "application_name": "vector-nats-home-wiretap",
        "service_name": "vector-nats-home-wiretap",
        "nats_subject": %nats.subject,
        "_time": now(),
        "_msg": .
      }
sinks:
  metrics_expose:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598
  log_store:
    type: http
    inputs:
    - nats_event_transform
    encoding:
      codec: native_json
    uri: https://vector.w7x6t.dev/sink/http_native_json_logs
