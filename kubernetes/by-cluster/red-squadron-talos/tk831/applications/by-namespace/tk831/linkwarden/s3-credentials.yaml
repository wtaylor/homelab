apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-s3-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  target:
    deletionPolicy: Delete
  data:
  - secretKey: SPACES_KEY
    remoteRef:
      key: linkwarden/s3/access_key
  - secretKey: SPACES_SECRET
    remoteRef:
      key: linkwarden/s3/secret_key
