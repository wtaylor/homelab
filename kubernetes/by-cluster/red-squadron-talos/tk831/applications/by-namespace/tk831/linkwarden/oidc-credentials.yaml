apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-oidc-client-credentials
  labels:
    app.kubernetes.io/name: linkwarden
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: KEYCLOAK_CLIENT_ID
    remoteRef:
      key: linkwarden/oauth-client-credentials/client_id
  - secretKey: KEYCLOAK_CLIENT_SECRET
    remoteRef:
      key: linkwarden/oauth-client-credentials/client_secret
