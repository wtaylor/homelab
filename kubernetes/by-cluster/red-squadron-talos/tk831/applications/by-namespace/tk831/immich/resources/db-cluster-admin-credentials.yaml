apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dbc-postgres-tk831-immich-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: username
    remoteRef:
      key: immich
      property: postgres_superuser_username
  - secretKey: password
    remoteRef:
      key: immich
      property: postgres_superuser_password
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
