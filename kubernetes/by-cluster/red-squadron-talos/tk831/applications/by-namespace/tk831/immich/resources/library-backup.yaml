apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-library-volsync-restic-config
  labels:
    app.kubernetes.io/name: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 60m
  target:
    template:
      type: kubernetes.io/Opaque
      data:
        RESTIC_REPOSITORY: rest:http://data-backup-server.willtaylor.info:8080/volumes/immich-library
        RESTIC_PASSWORD: "{{ .restic_password }}"
        RESTIC_REST_USERNAME: "{{ .rclone_username }}"
        RESTIC_REST_PASSWORD: "{{ .rclone_password }}"
    deletionPolicy: Delete
  data:
  - secretKey: rclone_username
    remoteRef:
      key: volsync/rclone/username
  - secretKey: rclone_password
    remoteRef:
      key: volsync/rclone/password
  - secretKey: restic_password
    remoteRef:
      key: volsync/restic/password
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-library
  labels:
    app.kubernetes.io/name: immich
spec:
  sourcePVC: immich-library
  trigger:
    # Take a backup every night at 4am
    schedule: "00 4 * * *"
  restic:
    cacheCapacity: 4Gi
    cacheStorageClassName: proxmox-zfs
    copyMethod: Direct
    pruneIntervalDays: 7
    repository: immich-library-volsync-restic-config
    retain:
      hourly: 1
      daily: 7
      weekly: 2
      monthly: 2
      yearly: 0
