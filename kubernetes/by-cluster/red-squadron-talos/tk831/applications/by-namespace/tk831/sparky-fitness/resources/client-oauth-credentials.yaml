apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparky-fitness-oauth-client-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: client_id
    remoteRef:
      key: sparky-fitness
      property: oauth_client_credentials_client_id
  - secretKey: client_secret
    remoteRef:
      key: sparky-fitness
      property: oauth_client_credentials_client_secret
