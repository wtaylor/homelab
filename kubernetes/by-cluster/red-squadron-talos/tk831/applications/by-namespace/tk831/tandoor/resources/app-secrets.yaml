apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-app-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  target:
    deletionPolicy: Delete
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: tandoor
      property: app_secret_key