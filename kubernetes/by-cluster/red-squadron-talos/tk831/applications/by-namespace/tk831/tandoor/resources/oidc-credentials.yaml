apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-oidc-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id":"kanidm","name":"Kanidm","client_id":"{{ .client_id }}","secret":"{{ .client_secret }}","settings":{"server_url":"https://auth.w7x6t.dev/oauth2/openid/tandoor/.well-known/openid-configuration"}}]}}'
  data:
  - secretKey: client_id
    remoteRef:
      key: tandoor
      property: oauth_client_credentials_client_id
  - secretKey: client_secret
    remoteRef:
      key: tandoor
      property: oauth_client_credentials_client_secret