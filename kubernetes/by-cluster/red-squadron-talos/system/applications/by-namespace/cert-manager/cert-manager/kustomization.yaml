commonAnnotations:
  app.w7x6t.dev/part-of: "k8s-cluster-system"
  app.w7x6t.dev/application: "cert-manager"
helmCharts:
- releaseName: cert-manager
  name: cert-manager
  repo: https://charts.jetstack.io
  includeCRDs: true
  version: v1.21.3
  namespace: cert-manager
  valuesInline:
    crds:
      enabled: true
    podAnnotations:
      app.w7x6t.dev/service: "cert-manager"
    webhook:
      podAnnotations:
        app.w7x6t.dev/service: "cert-manager-webhook"
    cainjector:
      podAnnotations:
        app.w7x6t.dev/service: "cert-manager-cainjector"
    startupapicheck:
      podAnnotations:
        app.w7x6t.dev/service: "cert-manager-startupapicheck"
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: '1.1.1.1:53,8.8.8.8:53'
resources:
- resources/cloudflare-credentials.yaml
- resources/cluster-issuer.yaml
