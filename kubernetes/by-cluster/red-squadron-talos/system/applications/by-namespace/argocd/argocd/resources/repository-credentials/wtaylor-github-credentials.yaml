apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wtaylor-github-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: username
    remoteRef:
      key: argocd/repo-creds-github-wtaylor/username
  - secretKey: password
    remoteRef:
      key: argocd/repo-creds-github-wtaylor/password
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/wtaylor
        username: '{{ .username }}'
        password: '{{ .password }}'
