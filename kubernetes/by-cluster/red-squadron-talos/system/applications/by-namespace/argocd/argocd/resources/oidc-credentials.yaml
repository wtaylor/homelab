apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: clientSecret
    remoteRef:
      key: argocd
      property: oauth_client_credentials_client_secret
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      engineVersion: v2
      data:
        oidc.client.clientSecret: '{{ .clientSecret }}'
