apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: w7x6t-dev-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: username
    remoteRef:
      key: argocd/repo-creds-w7x6t-dev/username
  - secretKey: password
    remoteRef:
      key: argocd/repo-creds-w7x6t-dev/password
  target:
    deletionPolicy: Delete
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://scm.w7x6t.dev/
        username: '{{ .username }}'
        password: '{{ .password }}'
