apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  app.w7x6t.dev/part-of: "k8s-cluster-system"
  app.w7x6t.dev/application: "cloudnativepg-operator"
resources:
- https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.27.0/cnpg-1.27.0.yaml
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cnpg-controller-manager
      namespace: cnpg-system
    spec:
      template:
        metadata:
          annotations:
            app.w7x6t.dev/service: "cnpg-controller-manager"
