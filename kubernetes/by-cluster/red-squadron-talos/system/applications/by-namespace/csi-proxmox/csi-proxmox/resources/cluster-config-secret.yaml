apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-plugin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: apiTokenId
    remoteRef:
      key: red-squadron-csi-proxmox
      property: proxmox_api_token_id
  - secretKey: apiToken
    remoteRef:
      key: red-squadron-csi-proxmox
      property: proxmox_api_token
  target:
    template:
      engineVersion: v2
      data:
        config.yaml: |
          clusters:
          - url: https://red-one.willtaylor.info:8006/api2/json
            insecure: true
            token_id: "{{ .apiTokenId }}"
            token_secret: "{{ .apiToken }}"
            region: red-squadron
