apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          annotations:
            app.w7x6t.dev/part-of: "k8s-cluster-system"
            app.w7x6t.dev/application: "default-cluster-gateway"
            app.w7x6t.dev/service: "default-cluster-gateway"
      envoyService:
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: "172.28.3.128"
