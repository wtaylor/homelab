apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onepassword-connect-http-redirect
spec:
  parentRefs:
  - name: default
    namespace: kube-system
    sectionName: http
  hostnames:
  - op-connect.w7x6t.dev
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onepassword-connect-https-backend
spec:
  parentRefs:
  - name: default
    namespace: kube-system
    sectionName: https
  hostnames:
  - op-connect.w7x6t.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: onepassword-connect
      port: 8080
