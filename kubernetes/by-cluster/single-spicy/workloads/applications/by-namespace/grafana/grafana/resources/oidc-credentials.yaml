apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-client-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-homelab
  refreshInterval: 5m
  data:
  - secretKey: client_id
    remoteRef:
      key: grafana
      property: sso_credentials_client_id
  - secretKey: client_secret
    remoteRef:
      key: grafana
      property: sso_credentials_client_secret
