apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    uid: loki
    name: loki
    type: loki
    access: proxy
    url: http://loki-vl-proxy.victoria-metrics.svc.cluster.local:3100
    basicAuth: false
    isDefault: false
    jsonData:
      pdcInjected: false
# "typeLogoUrl": "public/plugins/loki/img/loki_icon.svg",
