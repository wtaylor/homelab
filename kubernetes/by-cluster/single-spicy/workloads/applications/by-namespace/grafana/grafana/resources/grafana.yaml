apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  persistentVolumeClaim:
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  config:
    server:
      root_url: https://grafana.w7x6t.dev
    log:
      mode: "console"
    auth.generic_oauth:
      enabled: "true"
      name: "Kanidm"
      allow_sign_up: "true"
      client_id: ${AUTH_CLIENT_ID}
      client_secret: ${AUTH_CLIENT_SECRET}
      auth_url: "https://auth.w7x6t.dev/ui/oauth2"
      token_url: "https://auth.w7x6t.dev/oauth2/token"
      api_url: "https://auth.w7x6t.dev/oauth2/openid/grafana/userinfo"
      scopes: "openid email profile groups_name"
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: full_name
      groups_attribute_path: groups_name
      use_pkce: "true"
      use_refresh_token: "true"
      allow_assign_grafana_admin: "true"
      role_attribute_path: "contains(groups[*], 'operators') && 'GrafanaAdmin' || contains(groups[*], 'grafana_users') && 'Editor' || 'None'"
  disableDefaultAdminSecret: true
  deployment:
    spec:
      template:
        metadata:
          annotations:
            app.w7x6t.dev/part-of: "homelab"
            app.w7x6t.dev/application: "grafana"
            app.w7x6t.dev/service: "grafana"
        spec:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
          - name: grafana
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: password
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc-client-credentials
                  key: client_id
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc-client-credentials
                  key: client_secret
          volumes:
          - name: grafana-data
            persistentVolumeClaim:
              claimName: grafana-pvc
      strategy:
        type: Recreate
