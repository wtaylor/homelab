apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: vm-storage-logs
spec:
  podMetadata:
    annotations:
      app.w7x6t.dev/part-of: "homelab"
      app.w7x6t.dev/application: "vm-storage"
      app.w7x6t.dev/service: "vm-storage-logs"
  retentionPeriod: "31d"
  removePvcAfterDelete: true
  storage:
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      memory: 500Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 400m
