apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: vm-storage-logs
spec:
  retentionPeriod: "31d"
  removePvcAfterDelete: true
  storage:
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      memory: 500Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 400m
