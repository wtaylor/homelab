apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vm-storage-metrics
spec:
  podMetadata:
    annotations:
      app.w7x6t.dev/part-of: "homelab"
      app.w7x6t.dev/application: "vm-storage"
      app.w7x6t.dev/service: "vm-storage-metrics"
  retentionPeriod: "31d"
  removePvcAfterDelete: true
  selectAllByDefault: false
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      memory: 500Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 400m
