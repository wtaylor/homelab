apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: databasus-proxy-http-redirect
spec:
  parentRefs:
  - name: default
    namespace: kube-system
    sectionName: http
  hostnames:
  - databasus.tk831.net
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: databasus-proxy-https-backend
spec:
  parentRefs:
  - name: default
    namespace: kube-system
    sectionName: https
  hostnames:
  - databasus.tk831.net
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: databasus-proxy
      port: 80
