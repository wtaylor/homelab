commonAnnotations:
  app.w7x6t.dev/part-of: "k8s-cluster-system"
  app.w7x6t.dev/application: "vector-agent"
namespace: vector
configMapGenerator:
- name: vector-agent
  files:
  - ./files/vector.yaml
  namespace: vector
  options:
    disableNameSuffixHash: false
helmCharts:
- releaseName: vector-agent
  namespace: vector
  repo: https://helm.vector.dev
  name: vector
  version: v0.60.0
  valuesInline:
    role: Agent
    podAnnotations:
      vector.dev/exclude: "true"
      victoriametrics.com/vlexclude: "true"
      app.w7x6t.dev/service: "vector-agent"
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        memory: 1024Mi
    dataDir: /vector-data-dir
    existingConfigMaps: [vector-agent]
    containerPorts:
    - name: metrics
      containerPort: 9598
      protocol: TCP
    service:
      enabled: false
      # ports:
      # - name: glhttp
      #   port: 9598
      #   protocol: TCP
