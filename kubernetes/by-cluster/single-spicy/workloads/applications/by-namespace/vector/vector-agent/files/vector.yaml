# $schema: https://jonohill.github.io/vector-schema/schema.json
data_dir: /vector-data-dir
schema:
  log_namespace: true
api:
  enabled: true
  address: 127.0.0.1:8686
sources:
  internal_metrics:
    type: internal_metrics
  kubernetes_logs:
    type: kubernetes_logs
    # kubernetes_cluster_name
    # kubernetes_node_hostname
    # kubernetes_node_region
    # kubernetes_node_zone
    # kubernetes_pod_namespace
    # kubernetes_pod_name
    # kubernetes_pod_ip
    # kubernetes_container_image
    # kubernetes_container_name
    # physical_host
    # host
    # part_of (app.w7x6t.dev/part-of)
    # application (app.w7x6t.dev/application)
    # service_name (app.w7x6t.dev/service)
    # env (app.w7x6t.dev/env)
    # instance (app.w7x6t.dev/instance)
transforms:
  debug_inspect:
    type: remap
    inputs: [kubernetes_logs]
    source: |
      . = {
        "event": .,
        "metadata": %
      }
  kubernetes_log_parse:
    type: remap
    inputs:
    - kubernetes_logs
    source: |-
      raw = string!(.)
      parsed =
        parse_json(raw) ??
        parse_common_log(raw) ??
        parse_klog(raw) ??
        parse_glog(raw) ??
        parse_syslog(raw) ??
        { "message": raw }

      msg = raw
      if exists(parsed.message) {
        msg = parsed.message
        del(parsed.message)
      } else if exists(parsed.msg) {
        msg = parsed.msg
        del(parsed.msg)
      } else if exists(parsed.log) {
        msg = parsed.log
        del(parsed.log)
      } else if exists(parsed.text) {
        msg = parsed.text
        del(parsed.text)
      } else if exists(parsed.content) {
        msg = parsed.content
        del(parsed.content)
      } else if exists(parsed.body) {
        msg = parsed.body
        del(parsed.body)
      } else if exists(parsed."@m") {
        msg = parsed."@m"
        del(parsed."@m")
      } else if exists(parsed.RenderedMessage) {
        msg = parsed.RenderedMessage
        del(parsed.RenderedMessage)
      } else if exists(parsed.Message) {
        msg = parsed.Message
        del(parsed.Message)
      } else if exists(parsed."@mt") {
        msg = parsed."@mt"
        del(parsed."@mt")
      } else if exists(parsed._raw) {
        msg = parsed._raw
        del(parsed._raw)
      } else if exists(parsed.short_message) {
        msg = parsed.short_message
        del(parsed.short_message)
      } else if exists(parsed.raw) {
        msg = parsed.raw
        del(parsed.raw)
      } else if exists(parsed.line) {
        msg = parsed.line
        del(parsed.line)
      } else if exists(parsed.payload) {
        msg = parsed.payload
        del(parsed.payload)
      } else if exists(parsed.description) {
        msg = parsed.description
        del(parsed.description)
      }

      . = {
        "_msg": msg,
        "_time": %kubernetes_logs.timestamp,
        "app": parsed
      }

      .origin_type = "kubernetes_logs"
      .origin_collector = "vector"
      .host = %kubernetes_logs.pod_node_name

      pod_annotations = %kubernetes_logs.pod_annotations
      pod_labels = %kubernetes_logs.pod_labels
      node_labels = %kubernetes_logs.node_labels

      .part_of = pod_annotations."app.w7x6t.dev/part-of" || pod_labels."app.kubernetes.io/part-of"
      .application_name = pod_annotations."app.w7x6t.dev/application" || pod_labels."app.kubernetes.io/name"
      .service_name = pod_annotations."app.w7x6t.dev/service" || pod_labels."app.kubernetes.io/name"
      .instance = pod_annotations."app.w7x6t.dev/instance" || pod_labels."app.kubernetes.io/instance"
      .env = pod_annotations."app.w7x6t.dev/env" || pod_labels.env
      .host_physical = node_labels."topology.kubernetes.io/zone"

      .kubernetes_cluster_name = "single-spicy"
      .kubernetes_node_hostname = %kubernetes_logs.pod_node_name
      .kubernetes_node_region = node_labels."topology.kubernetes.io/region"
      .kubernetes_node_zone = node_labels."topology.kubernetes.io/zone"
      .kubernetes_pod_namespace = %kubernetes_logs.pod_namespace
      .kubernetes_pod_name = %kubernetes_logs.pod_name
      .kubernetes_pod_ip = %kubernetes_logs.pod_ip
      .kubernetes_pod_owner = %kubernetes_logs.pod_owner
      .kubernetes_container_image = %kubernetes_logs.container_image
      .kubernetes_container_name = %kubernetes_logs.container_name

      # Drop fields whose metadata was missing (null)
      . = compact(., null: true)
sinks:
  metrics_expose:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: 0.0.0.0:9598
