apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vector-aggregator-https
spec:
  parentRefs:
  - name: default
    namespace: kube-system
    sectionName: https
  hostnames:
  - vector.w7x6t.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /sinks/prw_generic
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: vector-aggregator
      port: 9090
  - matches:
    - path:
        type: PathPrefix
        value: /sinks/http_native_json_logs
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: vector-aggregator
      port: 8081
  - matches:
    - path:
        type: PathPrefix
        value: /sinks/http_native_json_metrics
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: vector-aggregator
      port: 8082
