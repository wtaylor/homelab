# $schema: https://jonohill.github.io/vector-schema/schema.json
data_dir: /vector-data-dir
api:
  enabled: true
  address: 127.0.0.1:8686
sources:
  prw_generic:
    type: prometheus_remote_write
    address: 0.0.0.0:9090
  syslog:
    type: syslog
    address: 0.0.0.0:1468
    mode: tcp
  http_native_json_logs:
    type: http_server
    address: 0.0.0.0:8081
    decoding:
      codec: native_json
  http_native_json_metrics:
    type: http_server
    address: 0.0.0.0:8082
    decoding:
      codec: native_json
sinks:
  vlogs:
    inputs:
    - http_native_json_logs
    type: elasticsearch
    endpoints:
    - http://vlsingle-vm-storage-logs.victoria-metrics.svc.cluster.local:9428/insert/elasticsearch/
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: _msg
      _time_field: _time
      _stream_fields: "part_of,application_name,service_name,instance,env,host,host_physical,kubernetes_cluster_name,kubernetes_pod_name,kubernetes_container_name"
  vmetrics:
    type: prometheus_remote_write
    inputs:
    - prw_generic
    endpoint: "http://vmsingle-vm-storage-metrics.victoria-metrics.svc.cluster.local:8428/api/v1/write"
    healthcheck:
      enabled: false
