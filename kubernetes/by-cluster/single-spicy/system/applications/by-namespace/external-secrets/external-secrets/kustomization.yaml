commonAnnotations:
  app.w7x6t.dev/part-of: "k8s-cluster-system"
  app.w7x6t.dev/application: "external-secrets"
namespace: external-secrets
helmCharts:
- releaseName: external-secrets
  name: external-secrets
  repo: https://charts.external-secrets.io
  version: "2.14.0"
  namespace: external-secrets
  includeCRDs: true
  valuesInline:
    podAnnotations:
      app.w7x6t.dev/service: "external-secrets"
    webhook:
      podAnnotations:
        app.w7x6t.dev/service: "external-secrets-webhook"
    certController:
      podAnnotations:
        app.w7x6t.dev/service: "external-secrets-cert-controller"
resources:
- ./resources/cluster-secret-store.yaml
- ./resources/css-1password.yaml
- ./resources/service-account.yaml
- ./resources/service-account-crb.yaml
secretGenerator:
- name: op-homelab-token
  options:
    disableNameSuffixHash: true
  envs:
  - onepass.secrets.env
