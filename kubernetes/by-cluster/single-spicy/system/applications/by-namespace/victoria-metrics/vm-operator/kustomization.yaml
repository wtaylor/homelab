commonAnnotations:
  app.w7x6t.dev/part-of: "k8s-cluster-system"
  app.w7x6t.dev/application: "vm-operator"
helmCharts:
- releaseName: vm-operator
  namespace: victoria-metrics
  repo: https://victoriametrics.github.io/helm-charts
  name: victoria-metrics-operator
  version: 0.68.1
  valuesInline:
    nameOverride: 'vm-operator'
    admissionWebhooks:
      enabled: true
      certManager:
        enabled: true
        # watchNamespaces: []
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vm-operator
      namespace: victoria-metrics
    spec:
      template:
        metadata:
          annotations:
            app.w7x6t.dev/service: "vm-operator"
